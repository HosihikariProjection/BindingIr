name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Contract checks
        run: dotnet run --project tests/Hosihikari.Binding.Ir.Tests/Hosihikari.Binding.Ir.Tests.csproj -c Release
      - name: Formatting
        run: dotnet format Hosihikari.Binding.Ir.slnx --verify-no-changes
